name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLANG_FORMAT_VERSION: "23.1.3"

jobs:
  build-test:
    name: build + test (${{ matrix.compiler }}, Release)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DINTROALGO_WERROR=ON
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test (unit tests, examples, benchmark smoke run)
        run: ctest --test-dir build --output-on-failure --parallel 4
      - name: Install and use as a package
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/introalgo-install"
          mkdir "$RUNNER_TEMP/consumer"
          cp tests/package_consumer/* "$RUNNER_TEMP/consumer/"
          cmake -S "$RUNNER_TEMP/consumer" -B "$RUNNER_TEMP/consumer/build" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/introalgo-install" \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build "$RUNNER_TEMP/consumer/build"
          "$RUNNER_TEMP/consumer/build/use_introalgo"

  sanitizers:
    name: AddressSanitizer + UBSan (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++-18
    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DINTROALGO_SANITIZE=ON -DINTROALGO_WERROR=ON
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        run: python3 -m pip install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
